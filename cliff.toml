# git-cliff config for @karmaniverous/npm-package-template-ts
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.pr_number %} \
                ([#{{ commit.remote.pr_number }}](https://github.com/karmaniverous/npm-package-template-ts/pull/{{ commit.remote.pr_number }}))\
            {% endif %}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^feature", group = "<!-- 0 -->🚀 Features" },
    { message = "^bugfix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^hotfix", group = "<!-- 2 -->🔥 Hotfixes" },
    { message = "^docs", group = "<!-- 3 -->📚 Documentation" },
    { message = "^chore", group = "<!-- 4 -->⚙️ Chores" },
    { message = ".*", group = "<!-- 5 -->💼 Other" },
]
filter_commits = false
tag_pattern = "[0-9].*"
sort_commits = "oldest"
topo_order_commits = true
