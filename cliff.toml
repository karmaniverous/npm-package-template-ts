# git-cliff config for @karmaniverous/npm-package-template-ts
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.pr_number %} \
                ([#{{ commit.remote.pr_number }}](https://github.com/karmaniverous/npm-package-template-ts/pull/{{ commit.remote.pr_number }}))\
            {% endif %}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Commit parsers are deliberately PERMISSIVE and are NOT coupled to the
# Lefthook branch-naming policy (.lefthook/pre-commit/branch-naming-policy).
# Their only job is to sort commits into changelog groups. They accept the
# common type words (Conventional Commit types, Git Flow branch prefixes &
# their usual variants), case-insensitively, with or without a scope, a `!`
# or the `[ISSUE-123]` prefix that the Lefthook add-issue hook prepends.
# Anything unrecognised lands in Other. Change branch policy in ONE place:
# the Lefthook script. See README § Changelog.
#
# Group names carry a zero-padded sort key so groups render in this order.
commit_parsers = [
    { message = '(?i)^Merge (pull request|branch|remote-tracking branch)\b', skip = true },
    { message = '(?i)^(\[[^\]]*\]\s*)?chore(\(release\))?!?:\s*release\b', skip = true },
    # Dependency bumps: any type scoped (dep)/(deps)/(deps-dev), as Dependabot
    # & Renovate write them, or a bare dep:/deps: type.
    { message = '(?i)^(\[[^\]]*\]\s*)?([a-z]+\(deps?(-dev)?\)|deps?(\([^)]*\))?)!?:', skip = true },
    { message = '(?i)^(\[[^\]]*\]\s*)?(feat|feats|feature|features)\b', group = "<!-- 00 -->🚀 Features" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(fix|fixes|fixed|bug|bugs|bugfix|bugfixes)\b', group = "<!-- 01 -->🐛 Bug Fixes" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(hotfix|hotfixes)\b', group = "<!-- 02 -->🔥 Hotfixes" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(sec|security)\b', group = "<!-- 03 -->🔒 Security" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(refactor|refactors|refactoring)\b', group = "<!-- 04 -->🔨 Refactoring" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(perf|performance)\b', group = "<!-- 05 -->⚡ Performance" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(doc|docs|documentation)\b', group = "<!-- 06 -->📚 Documentation" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(test|tests|testing)\b', group = "<!-- 07 -->🧪 Testing" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(style|styles|styling|format|formatting|lint)\b', group = "<!-- 08 -->🎨 Styling" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(ci|cd|build|builds)\b', group = "<!-- 09 -->🔧 Build & CI" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(revert|reverts|reverted)\b', group = "<!-- 10 -->◀️ Reverts" },
    { message = '(?i)^(\[[^\]]*\]\s*)?(chore|chores|maint|maintenance|release)\b', group = "<!-- 11 -->⚙️ Chores" },
    { message = '.*', group = "<!-- 12 -->💼 Other" },
]
filter_commits = false
tag_pattern = "[0-9].*"
sort_commits = "oldest"
topo_order_commits = true
